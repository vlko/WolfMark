name: Release

# Push a tag like v0.2.0 (or v0.2.0-rc.1 for a pre-release) to build Windows (x64, ARM64), Linux (x64) and
# macOS (Apple Silicon) and publish a GitHub Release with the Native AOT builds attached.
# The Android APK is attached too when the repository has a signing key (android/README.md).
# The release text is docs/release-notes/<tag>.md when it exists, otherwise GitHub's generated commit list.
on:
  push:
    tags: ['v*']

# Only the job that creates the release may write.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    # A tag is released only when the tests pass on it – the CI workflow may not have run on this very commit.
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --solution WolfMark.CrossPlatform.slnf -c Release

  build:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $full = "${{ github.ref_name }}".TrimStart('v')          # 0.2.0 or 0.2.0-rc.1
          $numeric = ($full -split '[-+]')[0]                        # 0.2.0
          if ($numeric -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH[-suffix]" }
          "full=$full" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT

      - name: Build
        # The Windows App SDK writes WolfMark.pri only in a regular build, not in the build that
        # dotnet publish runs itself – publishing alone fails with MSB3030 "WolfMark.pri not found".
        run: >
          dotnet build src/WolfMark.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.full }}
          -p:AssemblyVersion=${{ steps.version.outputs.numeric }}.0
          -p:FileVersion=${{ steps.version.outputs.numeric }}.0

      - name: AOT publish
        run: >
          dotnet publish src/WolfMark.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.full }}
          -p:AssemblyVersion=${{ steps.version.outputs.numeric }}.0
          -p:FileVersion=${{ steps.version.outputs.numeric }}.0
          -o publish/${{ matrix.rid }}

      - name: Smoke test
        # The very binary that gets released, on demo data (the x64 runner cannot start the ARM64 build). The
        # startup budget is the CI one: shared cores and no GPU.
        if: matrix.rid == 'win-x64'
        run: pwsh tools/smoke-windows.ps1 -PublishDir publish/${{ matrix.rid }} -WorkDir "${{ runner.temp }}/smoke" -StartupBudgetMs 3000

      - name: Zip
        shell: pwsh
        run: |
          # Debug symbols stay out of the download.
          Get-ChildItem publish/${{ matrix.rid }} -Recurse -Include *.pdb | Remove-Item
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath WolfMark-${{ steps.version.outputs.full }}-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: zip-${{ matrix.rid }}
          path: WolfMark-*.zip

  desktop:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: bash
        run: |
          full="${GITHUB_REF_NAME#v}"            # 0.2.0 or 0.2.0-rc.1
          numeric="${full%%[-+]*}"               # 0.2.0
          [[ "$numeric" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"

      - name: AOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb

      - name: Build
        run: >
          dotnet build src/WolfMark.Desktop -c Release -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.full }}
          -p:AssemblyVersion=${{ steps.version.outputs.numeric }}.0
          -p:FileVersion=${{ steps.version.outputs.numeric }}.0

      - name: AOT publish
        # Two steps (ADR 0005): a direct publish hands ILC the assembly without the compiled XAML.
        run: dotnet publish src/WolfMark.Desktop -c Release -r ${{ matrix.rid }} --no-build -o publish/${{ matrix.rid }}

      - name: Smoke test
        # The very binary that gets released, on demo data under Xvfb (Linux only – no such test for macOS yet).
        if: runner.os == 'Linux'
        run: bash tools/smoke-linux.sh publish/${{ matrix.rid }}/WolfMark.Desktop "${{ runner.temp }}/smoke"

      - name: Package
        run: bash tools/package-desktop.sh ${{ matrix.rid }} ${{ steps.version.outputs.full }} publish/${{ matrix.rid }} dist

      - uses: actions/upload-artifact@v7
        with:
          name: zip-${{ matrix.rid }}
          path: dist/*

  android:
    # The Android app, signed with the repository's key. Without the key (secrets, android/README.md) the job
    # only tests and the release goes out without an APK.
    name: Publish android
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Version from tag
        id: version
        run: |
          full="${GITHUB_REF_NAME#v}"
          numeric="${full%%[-+]*}"
          [[ "$numeric" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/wolfmark.jks"
            echo "WOLFMARK_KEYSTORE=$RUNNER_TEMP/wolfmark.jks" >> "$GITHUB_ENV"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret - the release has no Android APK."
          fi

      - name: Test
        run: ./gradlew --no-daemon :core:test

      - name: Build
        if: steps.key.outputs.present == 'true'
        env:
          WOLFMARK_KEYSTOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WOLFMARK_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WOLFMARK_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WOLFMARK_MSALCLIENTID: ${{ vars.WOLFMARK_MSAL_CLIENT_ID }}
          WOLFMARK_VERSION: ${{ steps.version.outputs.full }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/WolfMark-${{ steps.version.outputs.full }}-android.apk"

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.present == 'true'
        with:
          name: zip-android
          path: WolfMark-*.apk

  release:
    name: GitHub Release
    needs: [build, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: zip-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          # A suffix (v0.2.0-rc.1) or a pre-release .NET SDK in global.json means pre-release.
          if [[ "$TAG" == *-* ]] || grep -q '"version": *"[0-9.]*-' global.json; then prerelease="--prerelease"; fi
          # Release notes written for the tag (docs/release-notes/v0.3.1.md) win over the generated commit list.
          notes=(--generate-notes)
          if [[ -f "docs/release-notes/$TAG.md" ]]; then notes=(--notes-file "docs/release-notes/$TAG.md"); fi
          # So a download can be checked against what was built here.
          # The Android APK is there only when the repository has a signing key.
          shopt -s nullglob
          files=(WolfMark-*.zip WolfMark-*.tar.gz WolfMark-*.apk)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          gh release create "$TAG" "${files[@]}" SHA256SUMS.txt \
            --title "WolfMark ${TAG#v}" \
            "${notes[@]}" \
            $prerelease
