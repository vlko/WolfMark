name: Release

# Push a tag like v0.2.0 (or v0.2.0-rc.1 for a pre-release) to build Windows (x64, ARM64), Linux (x64) and
# macOS (Apple Silicon) and publish a GitHub Release with the Native AOT builds attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $full = "${{ github.ref_name }}".TrimStart('v')          # 0.2.0 or 0.2.0-rc.1
          $numeric = ($full -split '[-+]')[0]                        # 0.2.0
          if ($numeric -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH[-suffix]" }
          "full=$full" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT

      - name: Build
        # The Windows App SDK writes WolfMark.pri only in a regular build, not in the build that
        # dotnet publish runs itself – publishing alone fails with MSB3030 "WolfMark.pri not found".
        run: >
          dotnet build src/WolfMark.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.full }}
          -p:AssemblyVersion=${{ steps.version.outputs.numeric }}.0
          -p:FileVersion=${{ steps.version.outputs.numeric }}.0

      - name: AOT publish
        run: >
          dotnet publish src/WolfMark.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.full }}
          -p:AssemblyVersion=${{ steps.version.outputs.numeric }}.0
          -p:FileVersion=${{ steps.version.outputs.numeric }}.0
          -o publish/${{ matrix.rid }}

      - name: Zip
        shell: pwsh
        run: |
          # Debug symbols stay out of the download.
          Get-ChildItem publish/${{ matrix.rid }} -Recurse -Include *.pdb | Remove-Item
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath WolfMark-${{ steps.version.outputs.full }}-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.rid }}
          path: WolfMark-*.zip

  desktop:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: bash
        run: |
          full="${GITHUB_REF_NAME#v}"            # 0.2.0 or 0.2.0-rc.1
          numeric="${full%%[-+]*}"               # 0.2.0
          [[ "$numeric" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"

      - name: AOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Build
        run: >
          dotnet build src/WolfMark.Desktop -c Release -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.full }}
          -p:AssemblyVersion=${{ steps.version.outputs.numeric }}.0
          -p:FileVersion=${{ steps.version.outputs.numeric }}.0

      - name: AOT publish
        # Two steps (ADR 0005): a direct publish hands ILC the assembly without the compiled XAML.
        run: dotnet publish src/WolfMark.Desktop -c Release -r ${{ matrix.rid }} --no-build -o publish/${{ matrix.rid }}

      - name: Package
        run: tools/package-desktop.sh ${{ matrix.rid }} ${{ steps.version.outputs.full }} publish/${{ matrix.rid }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.rid }}
          path: dist/*

  release:
    name: GitHub Release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          # A suffix (v0.2.0-rc.1) or the .NET 11 release candidate SDK means pre-release.
          if [[ "$TAG" == *-* ]] || grep -q '"version": *"[0-9.]*-' global.json; then prerelease="--prerelease"; fi
          gh release create "$TAG" WolfMark-*.zip WolfMark-*.tar.gz \
            --title "WolfMark ${TAG#v}" \
            --generate-notes \
            $prerelease
