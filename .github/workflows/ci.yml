name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  domain:
    name: Domain libraries (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WolfMark.CrossPlatform.slnf -c Release
      - name: Test
        run: dotnet test --solution WolfMark.CrossPlatform.slnf -c Release --no-build

  windows:
    name: Windows build, tests, AOT publish
    runs-on: windows-latest
    strategy:
      # Report both architectures – one failing must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WolfMark.sln -c Release -p:Platform=${{ matrix.platform }}
      - name: Test
        if: matrix.rid == 'win-x64'
        run: dotnet test --solution WolfMark.CrossPlatform.slnf -c Release
      - name: AOT publish
        # Relies on the Build step above: the Windows App SDK writes WolfMark.pri only in a regular
        # build (with the same Platform), not in the build dotnet publish runs itself (MSB3030).
        run: dotnet publish src/WolfMark.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: WolfMark-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

  desktop:
    name: macOS/Linux app, AOT publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          # Native AOT for macOS needs the Apple toolchain – only on a Mac runner.
          - rid: osx-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: AOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Build
        run: dotnet build src/WolfMark.Desktop -c Release -r ${{ matrix.rid }}
      - name: AOT publish
        # Two steps (ADR 0005): a direct publish hands ILC the assembly without the compiled XAML.
        run: dotnet publish src/WolfMark.Desktop -c Release -r ${{ matrix.rid }} --no-build -o publish/${{ matrix.rid }}
      - name: Package
        run: bash tools/package-desktop.sh ${{ matrix.rid }} ci publish/${{ matrix.rid }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: WolfMark-${{ matrix.rid }}
          path: dist/*
