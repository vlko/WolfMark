name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  domain:
    name: Domain libraries (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Zapisnik.CrossPlatform.slnf -c Release
      - name: Test
        run: dotnet test --solution Zapisnik.CrossPlatform.slnf -c Release --no-build

  windows:
    name: Windows build, tests, AOT publish
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Zapisnik.sln -c Release -p:Platform=${{ matrix.rid == 'win-x64' && 'x64' || 'ARM64' }}
      - name: Test
        if: matrix.rid == 'win-x64'
        run: dotnet test --solution Zapisnik.CrossPlatform.slnf -c Release
      - name: AOT publish
        run: dotnet publish src/Zapisnik.App -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: Zapisnik-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
