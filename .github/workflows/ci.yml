name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  domain:
    name: Domain libraries (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: UI strings are generated from the table
        # Both apps get their texts from tools/gen-strings.py; a hand edit of one output makes them differ.
        run: |
          python3 tools/gen-strings.py src/WolfMark.App/Strings
          git diff --exit-code -- src/WolfMark.App/Strings src/WolfMark.Presentation/Infrastructure src/WolfMark.Desktop/Infrastructure
      - name: Build
        run: dotnet build WolfMark.CrossPlatform.slnf -c Release
      - name: Test
        run: >
          dotnet test --solution WolfMark.CrossPlatform.slnf -c Release --no-build
          --results-directory TestResults --results-directory-layout per-module --report-xunit-trx
      - name: Report failed tests
        # Job logs need admin rights; annotations are public, so a flaky test is identifiable afterwards.
        if: failure()
        run: python3 tools/ci-test-annotations.py TestResults

  windows:
    name: Windows build, tests, AOT publish
    runs-on: windows-latest
    strategy:
      # Report both architectures – one failing must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WolfMark.sln -c Release -p:Platform=${{ matrix.platform }}
      - name: Test
        if: matrix.rid == 'win-x64'
        run: >
          dotnet test --solution WolfMark.CrossPlatform.slnf -c Release
          --results-directory TestResults --results-directory-layout per-module --report-xunit-trx
      - name: Report failed tests
        if: failure() && matrix.rid == 'win-x64'
        run: python tools/ci-test-annotations.py TestResults
      - uses: actions/upload-artifact@v7
        if: failure() && matrix.rid == 'win-x64'
        with:
          name: TestResults-${{ matrix.rid }}
          path: TestResults
      - name: AOT publish
        # Relies on the Build step above: the Windows App SDK writes WolfMark.pri only in a regular
        # build (with the same Platform), not in the build dotnet publish runs itself (MSB3030).
        run: dotnet publish src/WolfMark.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v7
        with:
          name: WolfMark-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
      - name: Smoke test
        # The real AOT binary on demo data: imports (no .NET / VC++ needed), screenshots, single instance,
        # .md files, startup. The runner has no GPU and shared cores: the startup budget only catches regressions
        # there – the 600 ms of M4-09 (ADR 0011) is measured on a real machine.
        if: matrix.rid == 'win-x64'
        run: pwsh tools/smoke-windows.ps1 -PublishDir publish/${{ matrix.rid }} -WorkDir "${{ runner.temp }}/smoke" -StartupBudgetMs 3000
      - uses: actions/upload-artifact@v7
        if: always() && matrix.rid == 'win-x64'
        with:
          name: smoke-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/smoke/screenshots
            ${{ runner.temp }}/smoke/*/local/logs
          if-no-files-found: ignore

  desktop:
    name: macOS/Linux app, AOT publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          # Native AOT for macOS needs the Apple toolchain – only on a Mac runner.
          - rid: osx-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: AOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb
      - name: Build
        run: dotnet build src/WolfMark.Desktop -c Release -r ${{ matrix.rid }}
      - name: AOT publish
        # Two steps (ADR 0005): a direct publish hands ILC the assembly without the compiled XAML.
        run: dotnet publish src/WolfMark.Desktop -c Release -r ${{ matrix.rid }} --no-build -o publish/${{ matrix.rid }}
      - name: Unit tests (macOS)
        # The app has no smoke test on macOS (no Xvfb there): at least the libraries and view models run on its
        # file system and file watcher. Report only until the first runs show it is stable on the runner.
        if: runner.os == 'macOS'
        continue-on-error: true
        run: dotnet test --solution WolfMark.CrossPlatform.slnf -c Release
      - name: Smoke test
        # The AOT binary on demo data under Xvfb: single instance, .md files, startup (report only).
        if: runner.os == 'Linux'
        run: bash tools/smoke-linux.sh publish/${{ matrix.rid }}/WolfMark.Desktop "${{ runner.temp }}/smoke"
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with:
          name: smoke-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/smoke/screenshots
            ${{ runner.temp }}/smoke/*/local/logs
          if-no-files-found: ignore
      - name: Package
        run: bash tools/package-desktop.sh ${{ matrix.rid }} ci publish/${{ matrix.rid }} dist
      - uses: actions/upload-artifact@v7
        with:
          name: WolfMark-${{ matrix.rid }}
          path: dist/*

  android:
    name: Android app, tests and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # With the repository's signing key (secrets, see android/README.md) the APK below installs and signs in;
      # without it – forks, pull requests from them – the build is only a check.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/wolfmark.jks"
            echo "WOLFMARK_KEYSTORE=$RUNNER_TEMP/wolfmark.jks" >> "$GITHUB_ENV"
          fi
      # :core:test reads ../testdata – the vectors the .NET tests check too.
      - name: Test, build, lint
        env:
          WOLFMARK_KEYSTOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WOLFMARK_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WOLFMARK_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WOLFMARK_MSALCLIENTID: ${{ vars.WOLFMARK_MSAL_CLIENT_ID }}
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug -Pscreenshots
      # The screens as drawn on the runner (Robolectric): to look at without a phone.
      - uses: actions/upload-artifact@v7
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: WolfMark-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: |
            android/core/build/reports
            android/app/build/reports
          if-no-files-found: ignore

